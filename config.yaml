enabled: true

language:
  # auto, zh_CN, or en_US
  mode: zh_CN

weather:
  enabled: true
  cache_minutes: 30
  timeout_seconds: 3

battery:
  enabled: true

location:
  mode: manual
  query:
    city: Wuhan
    country: China
  display:
    zh_CN:
      city: 武汉
      country: 中国
    en_US:
      city: Wuhan
      country: China

# Conservative character cap that keeps the injected block below about 500 tokens.
max_injected_chars: 1600
